[project]
name = "realism-gap"
version = "0.1.0"
description = "Paired-realism behavioral evaluations: does a model behave differently when the test looks like a test?"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3",
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "scipy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analysis*", "runner*", "scorers*"]
exclude = ["dashboard*", "hard_tasks*", "tasks*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
